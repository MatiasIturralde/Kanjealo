<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso — Kanjealo</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="admin-bg"><main class="login-page"><div class="brand"><span class="brand-mark">K</span>KANJEALO</div><h1>Panel de administración</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form class="form-card" method="post"><label>Usuario<input name="username" required></label><label>Contraseña<input type="password" name="password" required></label><button class="button">Ingresar</button></form></main></body></html>
