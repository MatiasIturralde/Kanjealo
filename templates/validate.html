<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validar canje — Kanjealo</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="admin-bg"><main class="form-page container"><a href="{{url_for('admin')}}">← Panel</a><div class="eyebrow">COMERCIO</div><h1>Validar código de canje</h1><form class="form-card" method="post"><label>Código<input name="redemption_code" placeholder="KC-XXXXXXXX" autofocus required></label><button class="button">Validar</button></form>{% if message %}<div class="result {{message[0]}}">{{message[1]}}</div>{% endif %}{% if result %}<div class="validation-card"><h2>{{result.business_name}}</h2><p>{{result.benefit_text}}</p><p>Compra mínima: {{result.minimum_purchase}}</p><strong>{{result.redemption_code}}</strong></div>{% endif %}</main></body></html>
