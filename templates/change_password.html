<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña — Kanjealo</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="admin-bg"><main class="form-page container"><a href="{{url_for('admin')}}">← Panel</a><h1>Cambiar contraseña</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form class="form-card" method="post"><label>Contraseña actual<input type="password" name="current" required></label><label>Nueva contraseña<input type="password" name="new" required></label><label>Repetir nueva contraseña<input type="password" name="confirm" required></label><button class="button">Actualizar</button></form></main></body></html>
