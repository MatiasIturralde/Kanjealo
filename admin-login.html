<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — Kanjealo</title>
  <link rel="stylesheet" href="./static/style.css">
</head>
<body class="admin-bg">

  <main class="login-page">
    <div class="brand">
      <span class="brand-mark">K</span>KANJEALO
    </div>
    <h1>Panel de administración</h1>

    <div class="flash-wrap" style="position:static;margin-bottom:15px;"></div>

    <form class="form-card" id="login-form">
      <label>
        Usuario
        <input name="username" id="username" value="admin" required autofocus>
      </label>
      <label>
        Contraseña
        <input type="password" name="password" id="password" value="admin123" required>
      </label>
      <button class="button" type="submit">Ingresar</button>
      <p class="muted" style="font-size:12px;margin:5px 0 0;text-align:center;">
        Credenciales demo: <b>admin</b> / <b>admin123</b>
      </p>
    </form>
    <div style="text-align:center;margin-top:20px;">
      <a href="./index.html" style="font-size:13px;color:var(--muted);font-weight:700;">← Volver al sitio público</a>
    </div>
  </main>

  <script src="./static/kanjealo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to admin
      if (Kanjealo.isAdminLoggedIn()) {
        window.location.href = './admin.html';
        return;
      }

      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;

        if (Kanjealo.loginAdmin(u, p)) {
          window.location.href = './admin.html';
        } else {
          Kanjealo.showToast('Usuario o contraseña incorrectos.', 'error');
        }
      });
    });
  </script>
</body>
</html>
